function rvMark(i){const q=Q.l[i],id=qid(q);Q.m[i]=!Q.m[i];let ex=IBK.find(x=>x.id==id);if(Q.m[i]){if(ex){if(ex.flags.indexOf('marked')<0)ex.flags.push('marked')}else IBK.unshift({id,q:q.q,o:q.o,a:q.a,e:q.e,s:q.s,c:q.c,yours:Q.a[i]==null?-1:Q.a[i],ts:Date.now(),flags:['marked'],st:'pending',n:0});if(!BK.some(b=>b[0]==q.q))BK.unshift([q.q,q.s,q.c]);toast('Bookmarked 🔖')}else{if(ex)ex.flags=ex.flags.filter(f=>f!='marked');BK=BK.filter(b=>b[0]!=q.q)}saveAll();draw()}
